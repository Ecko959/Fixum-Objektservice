# Baut die Website einmal täglich neu, damit neue Google-Bewertungen
# automatisch erscheinen. Der Build selbst holt die Bewertungen
# (scripts/fetch-reviews.mjs) - dieser Workflow stößt ihn nur an.
#
# Einrichtung (einmalig):
#   1. Vercel -> Project -> Settings -> Git -> Deploy Hooks:
#      Hook "bewertungen" für Branch "main" anlegen, URL kopieren.
#   2. GitHub -> Repo -> Settings -> Secrets and variables -> Actions:
#      Secret VERCEL_DEPLOY_HOOK mit dieser URL anlegen.
# Ohne Secret läuft der Workflow durch und tut nichts.
name: Bewertungen aktualisieren

on:
  schedule:
    - cron: "17 4 * * *" # täglich ca. 5:17 Uhr deutscher Winterzeit
  workflow_dispatch: {}

permissions: {}

jobs:
  neu-bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vercel-Build anstoßen
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK nicht gesetzt - nichts zu tun."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Neuer Build angestoßen."
